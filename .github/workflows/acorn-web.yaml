name: acorn-web
# Builds acorn/powder-web.tar.gz (single-threaded wasm + shell). Tags acorn-v* also get a release.
on:
  push:
    branches: [acorn/main]
    tags: ['acorn-v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.72
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install meson==1.12.0 ninja
      - run: npm ci
        working-directory: acorn/shell
      - run: acorn/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: powder-web
          path: acorn/powder-web.tar.gz
      - if: startsWith(github.ref, 'refs/tags/acorn-v')
        uses: softprops/action-gh-release@v2
        with:
          files: acorn/powder-web.tar.gz
