<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Acorn Powder Lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px system-ui, sans-serif; overflow: hidden; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; }
  #status[hidden] { display: none; }
  /* SDL writes inline px sizes on the canvas; !important lets the frame decide the CSS size instead */
  #canvas { display: none; width: 100% !important; height: auto !important; max-height: 100vh; aspect-ratio: 629 / 424; object-fit: contain; image-rendering: pixelated; touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<p id="status">Loading The Powder Toy…</p>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script type="module" src="shell.js"></script>
</body>
</html>
